<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17263b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="QuickConvert"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Pina QuickConvert</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f7fb;background:#101a2a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(100%,410px);background:#1b2a40;border:1px solid #3a4a62;border-radius:22px;padding:22px;box-shadow:0 15px 50px #0005}h1{font-size:23px;margin:0 0 4px}.sub{color:#a9bad1;font-size:13px;margin:0 0 20px}.switch{display:grid;grid-template-columns:1fr 1fr;background:#101a2a;border-radius:12px;padding:4px;gap:4px}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px;background:#30435c;color:white}.switch button.active{background:#5d9af6;color:#081527;font-weight:700}label{display:block;font-size:13px;color:#c3d0e1;margin:19px 0 7px}input{width:100%;font-size:30px;font-weight:600;border-radius:12px;padding:13px;background:#101a2a;border:1px solid #536680;color:white;outline:none}input:focus{border-color:#79adff}.result{margin-top:16px;padding:18px;border-radius:14px;background:#122138;text-align:center}.result small{color:#b2c3d9}.result strong{display:block;font-size:34px;margin:5px 0;overflow-wrap:anywhere}.fraction{color:#a9c7f8;font-size:14px}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.controls select{background:#101a2a;color:white;border:1px solid #536680;border-radius:8px;padding:8px}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.presets button{font-size:13px;padding:10px 3px}.footer{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.footer button{background:#5d9af6;color:#081527;font-weight:700}.hint{color:#8fa4be;font-size:11px}#status{font-size:12px;color:#9cc9a9;min-height:18px;margin-top:10px}</style></head><body><main class="app"><h1>📏 Pina QuickConvert</h1><p class="sub">Fast measurements, no fuss.</p><div class="switch"><button id="mmMode" class="active">mm → inches</button><button id="inMode">inches → mm</button></div><label for="value">Measurement</label><input id="value" type="number" min="0" step="any" inputmode="decimal" value="25.4" autofocus><section class="result" aria-live="polite"><small>Converted measurement</small><strong id="result">1.000 in</strong><div id="fraction" class="fraction">Nearest 1/64″: 1″</div></section><div class="controls"><label for="precision">Decimal places</label><select id="precision"><option>2</option><option selected>3</option><option>4</option><option>6</option></select></div><label>Quick values <span id="unit">(mm)</span></label><div class="presets" id="presets"></div><div class="footer"><span class="hint">1 inch = 25.4 mm</span><button id="copy">Copy result</button></div><div id="status" role="status"></div></main><script>const $=id=>document.getElementById(id);let mode=localStorage.getItem('qc-mode')||'mm';$('precision').value=localStorage.getItem('qc-precision')||'3';const gcd=(a,b)=>b?gcd(b,a%b):a;function fraction(inches){let whole=Math.floor(inches),num=Math.round((inches-whole)*64);if(num===64){whole++;num=0}if(!num)return `${whole}″`;let d=gcd(num,64);return `${whole?whole+' ':''}${num/d}/${64/d}″`}function render(){let raw=$('value').value,n=Number(raw),valid=raw.trim()!==''&&Number.isFinite(n)&&n>=0,out=mode==='mm'?n/25.4:n*25.4;let formatted=valid?out.toFixed(Number($('precision').value)):'—';$('result').textContent=formatted+' '+(mode==='mm'?'in':'mm');$('fraction').textContent=valid?'Nearest 1/64″: '+fraction(mode==='mm'?out:n):'';$('mmMode').classList.toggle('active',mode==='mm');$('inMode').classList.toggle('active',mode==='in');$('unit').textContent=mode==='mm'?'(mm)':'(inches)';$('presets').replaceChildren();(mode==='mm'?[1,3,5,10,12,20,25.4,50.8]:[.125,.25,.375,.5,.625,.75,1,2]).forEach(x=>{let b=document.createElement('button');b.textContent=String(x);b.onclick=()=>{$('value').value=x;render()};$('presets').append(b)});return valid?formatted+' '+(mode==='mm'?'in':'mm'):null}function setMode(m){if(mode!==m){const n=Number($('value').value);if($('value').value.trim()!==''&&Number.isFinite(n))$('value').value=Number((m==='mm'?n*25.4:n/25.4).toPrecision(12));mode=m;localStorage.setItem('qc-mode',m)}render()}$('mmMode').onclick=()=>setMode('mm');$('inMode').onclick=()=>setMode('in');$('value').oninput=render;$('precision').onchange=()=>{localStorage.setItem('qc-precision',$('precision').value);render()};$('copy').onclick=async()=>{let val=render();if(!val)return;try{await navigator.clipboard.writeText(val);$('status').textContent='Copied: '+val}catch{$('status').textContent='Clipboard unavailable; select the result to copy.'}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
